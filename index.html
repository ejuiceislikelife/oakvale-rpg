<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kingdom of Oakvale</title>

style.css

</head>

<body>

<div id="game">

    <header>

        <h1>⚔ KINGDOM OF OAKVALE ⚔</h1>

        <p>Fantasy RPG Adventure</p>

    </header>

    <div class="top-row">

        <div class="card">

            <h2>🧙 Hero</h2>

            <p id="levelText">Level 1</p>

            <label>Health</label>

            <div class="bar">
                <div id="hpBar"></div>
            </div>

            <label>Experience</label>

            <div class="bar xp">
                <div id="xpBar"></div>
            </div>

            <p id="goldText">
                🪙 Gold: 20
            </p>

        </div>

        <div class="card">

            <h2 id="enemyName">
                🐺 Wolf
            </h2>

            <div class="sprite">
                🐺
            </div>

            <div class="bar enemy">
                <div id="enemyHp"></div>
            </div>

        </div>

    </div>

    <div class="buttons">

        <button onclick="attackEnemy()">
            ⚔ Attack
        </button>

        <button onclick="restPlayer()">
            ❤️ Rest
        </button>

        <button onclick="acceptQuest()">
            📜 Quest
        </button>

    </div>

    <div id="dialogue">

        Welcome to Oakvale.

    </div>

    <div id="log">

    </div>

</div>

game.jsscript>

</body>
</html>
